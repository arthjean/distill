name: Native macOS arm64 qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TMPDIR: /private/tmp
      DISTILL_MACOS_EVIDENCE: ${{ runner.temp }}/distill-macos-root-layout-v1.json
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - name: Run native qualification
        run: ./scripts/qualify-macos.sh "$DISTILL_MACOS_EVIDENCE"
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: distill-macos-arm64-root-layout-v1
          path: ${{ env.DISTILL_MACOS_EVIDENCE }}
          if-no-files-found: error
