name: Native macOS arm64 qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TMPDIR: /private/tmp
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - name: Run native qualification
        run: ./scripts/qualify-macos.sh
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: distill-macos-arm64-qualification
          path: evaluation/release/evidence/macos-arm64.json
          if-no-files-found: error
