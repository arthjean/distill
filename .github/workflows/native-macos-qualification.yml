name: Native macOS arm64 qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TMPDIR: /private/tmp
      DISTILL_ARCH_AUTHORIZATION: /tmp/distill-architecture-hardening-v6-20260731-authorization.json
      DISTILL_ARCH_RECEIPT: /tmp/distill-architecture-hardening-v6-20260731/macos-arm64/receipt.json
      DISTILL_PACKAGE_OUTPUT: /tmp/distill-architecture-hardening-v6-20260731/macos-arm64/package
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14
      - name: Create exact qualification authorization
        run: |
          protocol_file="evaluation/release/architecture-hardening-v6-protocol.json"
          ledger_file="evaluation/release/architecture-hardening-v6-ledger.json"
          runner_file="evaluation/release/run-architecture-hardening-v6.mjs"
          jq -n \
            --arg revision "$GITHUB_SHA" \
            --arg authorized_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg protocol_sha "$(shasum -a 256 "$protocol_file" | awk '{print $1}')" \
            --arg ledger_sha "$(shasum -a 256 "$ledger_file" | awk '{print $1}')" \
            --arg runner_sha "$(shasum -a 256 "$runner_file" | awk '{print $1}')" \
            --slurpfile protocol "$protocol_file" \
            '$protocol[0] as $p | {
              schema_version: "distill.architecture-hardening-authorization/v1",
              qualification_id: $p.qualification_id,
              authorized_by: "Arthur Jean",
              authorized_at: $authorized_at,
              source_revision: $revision,
              source_tree: $p.source.source_tree,
              protocol_schema_version: $p.schema_version,
              protocol_sha256: $protocol_sha,
              ledger_sha256: $ledger_sha,
              runner_sha256: $runner_sha,
              maximum_cpu_seconds: $p.limits.maximum_cpu_seconds,
              maximum_subscription_invocations: $p.limits.maximum_subscription_invocations,
              incremental_dollar_ceiling_usd: $p.limits.incremental_dollar_ceiling_usd,
              destinations: $p.destinations,
              permitted_external_actions: $p.permitted_external_actions
            }' > "$DISTILL_ARCH_AUTHORIZATION"
          chmod 600 "$DISTILL_ARCH_AUTHORIZATION"
      - name: Validate preregistration
        run: bun evaluation/release/run-architecture-hardening-v6.mjs --validate-only
      - name: Run architecture-hardening qualification
        run: bun evaluation/release/run-architecture-hardening-v6.mjs --execute macos-arm64
      - name: Package macOS arm64
        run: ./scripts/package-native.sh
      - name: Upload architecture-hardening receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: distill-architecture-hardening-v6-macos-arm64
          path: ${{ env.DISTILL_ARCH_RECEIPT }}
          if-no-files-found: error
      - name: Upload native archive
        uses: actions/upload-artifact@v7
        with:
          name: distill-native-v0.1.0-macos-arm64
          path: |
            ${{ env.DISTILL_PACKAGE_OUTPUT }}/distill-macos-arm64.tar.gz
            ${{ env.DISTILL_PACKAGE_OUTPUT }}/distill-macos-arm64.tar.gz.sha256
          if-no-files-found: error
