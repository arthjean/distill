name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  native:
    name: Native checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchains
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
          rustup toolchain install nightly-2026-07-19 --profile minimal --component llvm-tools-preview

      - name: Install native quality tools
        run: |
          cargo install --locked cargo-llvm-cov --version 0.8.4
          cargo install --locked cargo-fuzz --version 0.12.0

      - name: Check native engine
        run: ./scripts/check-native.sh

  package:
    name: Package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Build native package
        run: ./scripts/package-native.sh

      - name: Verify archive and checksum
        run: |
          cd dist/native
          sha256sum -c distill-linux-x86_64.tar.gz.sha256
          tar -tzf distill-linux-x86_64.tar.gz

  corpus:
    name: Evaluation corpus
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.4

      - name: Verify corpus
        run: bun evaluation/corpus/check.mjs --verify
