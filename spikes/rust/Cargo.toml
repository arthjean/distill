[package]
name = "distill-spike-rust"
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
base64 = "=0.22.1"
libc = "=0.2.189"
rusqlite = "=0.40.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
wait-timeout = "=0.2.1"

[lints.clippy]
panic = "deny"
unimplemented = "deny"
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
unwrap_in_result = "warn"
